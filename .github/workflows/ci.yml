name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The saboteur starts CI on its own branches (see saboteur.yml).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same Postgres + Neon WebSocket proxy as docker-compose.yml, so the app
    # keeps its production driver in CI.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 20
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
        ports: ["54444:4444"]
    env:
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:55432/main
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm --filter @recount/web lint
      - name: Engine (unit, property, RCTab conformance, certified replays)
        run: pnpm --filter @recount/engine test
      - name: Web services (PGlite)
        run: pnpm --filter @recount/web test
      - name: Database (migrate and seed)
        run: pnpm --filter @recount/web db:migrate && pnpm --filter @recount/web db:seed
      - name: Build
        run: pnpm --filter @recount/web build
      - run: pnpm --filter @recount/web exec playwright install --with-deps chromium
      - name: End to end (Playwright against next start)
        run: pnpm --filter @recount/web test:e2e
      # Last, so a change that moves a mutant's target fails on its tests first.
      - name: Mutants still apply
        # On a saboteur branch its own mutant is already planted: that one reverses instead.
        run: for patch in mutants/*/patch.diff; do git apply --check "$patch" || git apply --check -R "$patch" || exit 1; done
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report

  # A run started with the workflow token can't trigger workflow_run, so the
  # saboteur's CI asks for its verdict itself.
  verdict:
    name: ask for the saboteur's verdict
    needs: ci
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'saboteur/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run saboteur-verdict.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
