name: preflight
# Runs when Vercel reports a preview deployment as live: a fast Playwright pass
# over every route of that deployment before TestSprite spends credits on it.
on:
  deployment_status:
permissions:
  contents: read
concurrency:
  group: preflight-${{ github.event.deployment.sha }}
  cancel-in-progress: true
jobs:
  preflight:
    name: preflight
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v6
      # The checked-out commit may come from any pull request: no shared cache to
      # write into and no install scripts; the token is read-only and holds no secrets.
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @recount/web exec playwright install --with-deps chromium
      - name: Every route of the preview
        run: pnpm --filter @recount/web exec playwright test e2e/preflight.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-report
          path: apps/web/playwright-report
